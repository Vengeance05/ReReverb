name: Build

# Every push and pull request builds both platforms and runs:
#   - the DSP unit tests,
#   - the session-compatibility checks (parameter IDs, golden renders),
#   - pluginval (strictness 10) on the VST3s, and auval on the Mac AUs.
# Pushing a tag like v1.0.1 also publishes a GitHub Release with the
# macOS installer (.pkg) and the Windows installer (.exe) + zips attached.
# Test builds (non-tag) skip link-time optimisation and build the Mac plugins
# for Apple Silicon only, so they finish much faster; releases are universal.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  JUCE_VERSION: 8.0.4
  PLUGINVAL_VERSION: v1.0.4

# A newer push to the same branch or tag cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: dependencies/JUCE
          key: juce-${{ env.JUCE_VERSION }}

      - name: Fetch JUCE
        run: |
          [ -f dependencies/JUCE/CMakeLists.txt ] || \
            git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git dependencies/JUCE

      - name: Parameter compatibility
        run: python3 tools/check_params.py

      - name: Build, test and package
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then export ARCHS=arm64 RR_LTO=OFF; fi
          ./make_installer.sh

      - name: Golden renders (old sessions must sound the same)
        run: |
          ./build-release/VistaRooms_Golden check tests/golden/vista_rooms.txt
          ./build-release/rr_golden_core check tests/golden/septima_core.txt

      - name: pluginval and auval
        run: |
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pv.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          for P in Septima "Vista Rooms"; do
            T=$( [ "$P" = "Septima" ] && echo Septima || echo VistaRooms )
            $PV --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate "build-release/${T}_artefacts/Release/VST3/$P.vst3"
          done
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build-release/*_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Sptm Rrvb
          auval -v aufx Vsta Rrvb

      - name: Zip plugins
        run: |
          V=$(sed -n 's/^project(Rereverb VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p zip/VST3 zip/Components
          cp -R build-release/Septima_artefacts/Release/VST3/Septima.vst3 "build-release/VistaRooms_artefacts/Release/VST3/Vista Rooms.vst3" zip/VST3/
          cp -R build-release/Septima_artefacts/Release/AU/Septima.component "build-release/VistaRooms_artefacts/Release/AU/Vista Rooms.component" zip/Components/
          cp README.md docs/INSTALL.md zip/
          (cd zip && ditto -c -k --sequesterRsrc --keepParent . "../dist/Rereverb-$V-macOS.zip")

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-2022   # VS 2022; JUCE 8.0.4 predates the VS 2026 compiler on windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: dependencies/JUCE
          key: juce-${{ env.JUCE_VERSION }}

      - name: Fetch JUCE
        shell: bash
        run: |
          [ -f dependencies/JUCE/CMakeLists.txt ] || \
            git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git dependencies/JUCE

      - name: Configure
        # No -G: use whichever Visual Studio the runner image has installed.
        shell: pwsh
        run: |
          cmake --version
          $lto = if ("$env:GITHUB_REF" -like "refs/tags/v*") { "ON" } else { "OFF" }
          cmake -S . -B build -A x64 -DRR_COPY_AFTER_BUILD=OFF -DRR_LTO="$lto"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: |
          build\Release\rr_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build\Release\VistaRooms_Golden.exe check tests\golden\vista_rooms.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build\Release\rr_golden_core.exe check tests\golden\septima_core.txt

      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          foreach ($p in @("build\Septima_artefacts\Release\VST3\Septima.vst3", "build\VistaRooms_artefacts\Release\VST3\Vista Rooms.vst3")) {
            & pv\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate $p
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Installer and zip
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(Rereverb VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist, zip\VST3 | Out-Null
          Copy-Item -Recurse build\Septima_artefacts\Release\VST3\Septima.vst3 zip\VST3\
          Copy-Item -Recurse "build\VistaRooms_artefacts\Release\VST3\Vista Rooms.vst3" zip\VST3\
          Copy-Item README.md, docs\INSTALL.md zip\
          Compress-Archive -Path zip\* -DestinationPath "dist\Rereverb-$v-Windows.zip"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows\rereverb.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk -v t="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"t {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          printf '%s\n\n%s\n' "$NOTES" "See docs/INSTALL.md for installation, including the one-time security approval on macOS and Windows." > notes.md
          gh release create "$GITHUB_REF_NAME" out/macos/* out/windows/* --title "Rereverb $GITHUB_REF_NAME" --notes-file notes.md
